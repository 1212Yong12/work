name: Publish portfolio
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Unpack the published portfolio
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${RELEASE_TAG:-$(gh release view --json tagName --jq .tagName)}"
          gh release download "$tag" --pattern portfolio-web.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/portfolio-web.zip" -d public
          test -s public/index.html
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the artifact to be available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..15}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].name' | grep -Fxq 'github-pages'; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Publish the portfolio
        id: deployment
        uses: actions/deploy-pages@v5.0.1
